# Read as the gradle.properties of the build root by the export of internal/open/meistercharts alone; inside the monorepo the values are
# project properties of :internal:open:meistercharts and its subprojects; the build flags equal those of internal/open/gradle.properties.
# The export appends the versions; tools/standalone-build/export-standalone.sh rejects a version written here.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
kotlin.daemon.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2048m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.incremental.js.ir=true
kotlin.js.yarn=false
kotlin.tests.individualTaskReports=true
# The merge request pipeline leaves the export out of `🧳 standalone build`: MeisterCharts may use API of internal/open before the
# Open release, the scheduled run and the release tag build the export against the last release.
standaloneBuildInMergeRequests=false

# Written by tools/standalone-build/export-standalone.sh from the checkout it exported.
buildplatformVersion=1.0.0
neckarOpenVersion=11.0.0
neckarHubVersion=11.1.0-SNAPSHOT
kotlinVersion=2.4.21
foojayResolverVersion=1.0.0
minimumGradleVersion=9.9.1
meisterchartsVersion=1.39.0-SNAPSHOT
