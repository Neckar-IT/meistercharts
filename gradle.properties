#
# Gradle runtime specific settings
#
# These four memory values are the single source of truth for every environment —
# CI, workstation and IDE alike. Do NOT override them in ~/.gradle/gradle.properties:
# Gradle reuses a daemon only when the JVM arguments match exactly, so every deviating
# value starts an ADDITIONAL daemon instead of reusing the running one. See
# docs/gradle/daemon-memory.md for the measurements behind the numbers.
#
# Note: --enable-native-access=ALL-UNNAMED suppresses Java 22+ warnings from Gradle's native-platform library
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
# Heap and metaspace deliberately identical to org.gradle.jvmargs: part of the Kotlin
# compilation ignores kotlin.daemon.jvmargs and inherits the Gradle daemon's JVM arguments
# instead. Differing values therefore produce TWO Kotlin daemons instead of one.
kotlin.daemon.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2048m

# An idle daemon keeps its whole heap. The Gradle default of 3 hours leaves several
# multi-GB processes behind after a day of branch switching.
org.gradle.daemon.idletimeout=600000

#Run in parallel
org.gradle.parallel=true

# taskinfo plugin does not support composite builds by default; required since
# build-logic/ is now an included build (see issue #1561 / MR !13645).
taskinfo.disableSafeguard=true

#Enable gradle build cache
org.gradle.caching=true

# Ist requires a lot of changes to make it work - see https://docs.gradle.org/8.8/userguide/configuration_cache.html
org.gradle.configuration-cache=false

# Configuration-on-demand is blocked by an upstream Kotlin Multiplatform race —
# see #1829 and KT-52074 (https://youtrack.jetbrains.com/issue/KT-52074).
# With cod=true, the root NPM-aggregation tasks (`rootPackageJson`,
# `kotlinNpmInstall`) reach into a KMP subproject's `jsNpmAggregated`
# configuration before that subproject has finished its `sourceSets { ... }`
# block. Any subsequent `commonMainApi`/`jsMainApi`/`commonTestImplementation`
# declaration in that subproject then fails with "Cannot mutate dependencies …
# after the configuration was observed". Verified independent of our convention
# helpers — the race fires on a plain `sourceSets { commonMain { api(project(...)) } }`
# block in any KMP module with `js { browser() }`. Minimal reproducer:
# `internal/sandbox/kmp-cod-repro/`. What would resolve it upstream is Gradle Project
# Isolation support in KGP JS & Wasm (KT-75899, closed as duplicate), planned for
# Kotlin 2.5.0-Beta1 — not 2.4.20, as this comment claimed until it was checked against
# the tracker. Since Kotlin 2.3.0-Beta2 the plugin warns on its own when
# configure-on-demand is enabled in a JS/Wasm project, so treat the combination as
# unsupported rather than imminent. Re-check at 2.5.0.
# Second failure mode of the same root cause, measured with Kotlin 2.4.10:
# docs/gradle/js-npm-aggregation.md
org.gradle.configureondemand=false

# One of these should disable welcome message
org.gradle.internal.launcher.welcomeMessageEnabled=false
systemProp.org.gradle.internal.launcher.welcomeMessageEnabled=false

#
# Kotlin properties
#
kotlin.code.style=official
#Caching is enabled by default
#kotlin.caching.enabled=true
#Avoid warnings for mpp stability
kotlin.mpp.stability.nowarn=true
# Incremental compiling for Kotlin JS
# Should be disabled when strange errors occur in lizergy/planner-ui in the console (RefNotFound/RStatic and other stuff)
kotlin.incremental.js.ir=true
# Use npm instead of the bundled yarn 1.22 for Kotlin/JS NPM resolution.
# The root package.json declares `packageManager: pnpm@<version>` for the
# pnpm-based workspace; yarn 1.22 does not understand that and aborts when
# it walks up from `build/js/`. npm tolerates the field, so the Kotlin/JS
# install path stays compatible with our pnpm workspace setup.
kotlin.js.yarn=false
# Enable XML reports for multi platform tests
kotlin.tests.individualTaskReports=true
#Kotlin Gradle plugin checks for JVM target compatibility
kotlin.jvm.target.validation.mode=error
#kotlin.mpp.import.enableKgpDependencyResolution=true

#
# Toolchain Configuration
#
#Try to auto-detect JDKs
org.gradle.java.installations.auto-detect=true

#Default values for installation paths (potentially overwritten in ~/.gradle/gradle.properties)
org.gradle.java.installations.paths=/usr/lib/jvm/java-25-openjdk-amd64/,/usr/lib/jvm/java-21-openjdk-amd64/

#Download the JDKs automatically - beware: The Oracle JDK 8 is *not* downloaded automatically
#Install the Oracle JDK manually (see tools/java/how-to-install-jdk.adoc)
org.gradle.java.installations.auto-download=true


ksp.useKSP2=true
