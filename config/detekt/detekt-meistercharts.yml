#
# Default configuration for all (other) projects that do not have a special configuration file
#
comments:
  AbsentOrWrongFileLicense:
    # licenseTemplateFile option removed in detekt 2.0; AbsentOrWrongFileLicense deactivated for upgrade transparency.
    active: false
  DeprecatedBlockTag:
    active: true
  OutdatedDocumentation:
    active: true
    allowParamOnConstructorProperties: true

#  UndocumentedPublicClass:
#    active: false - reactivate asap

style:
  ForbiddenImport:
    active: true
    forbiddenImports:
#      - "kotlin.time.Duration.Companion.milliseconds" ## Enable again to check for usages - milliseconds is boxing!
      - "javafx.*"

  ForbiddenMethodCall:
    active: true
    methods:
      - "kotlin.time.toDuration"
      - "kotlin.io.print"
      - "kotlin.io.println"
      - "com.benasher44.uuid.uuid4"
