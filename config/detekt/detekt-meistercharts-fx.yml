#
# Configuration file for JavaFX projects
#
comments:
  AbsentOrWrongFileLicense:
    # licenseTemplateFile option removed in detekt 2.0; AbsentOrWrongFileLicense deactivated for upgrade transparency.
    active: false
  DeprecatedBlockTag:
    active: true
  OutdatedDocumentation:
    active: true
    allowParamOnConstructorProperties: true

