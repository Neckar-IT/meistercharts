#
# NPM package versions — Single Source of Truth for all npm dependencies in the monorepo.
#
# Used by:
#   - package.template.json files (via GeneratePackageJsonPlugin)
#   - buildSrc plugins (TailwindPlugin, OpenApiValidatorPlugin, ProjectConfiguration)
#   - Kotlin/JS npm() declarations
#
# Convention:
#   Every entry has a `# npm: <actual-npm-package-name>` comment.
#   The TOML alias strips @ and replaces / and . with -
#   Renovate uses the `# npm:` comment to identify the real package name.
#

